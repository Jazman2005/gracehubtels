<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="1200" y2="400">
      <stop offset="0%" stop-color="#0A2A7A"/>
      <stop offset="100%" stop-color="#1a4a9e"/>
    </linearGradient>
    <linearGradient id="a-btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#e66a00"/>
    </linearGradient>
    <linearGradient id="a-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Base -->
  <rect width="1200" height="400" fill="url(#a-bg)" rx="16"/>
  <rect width="1200" height="400" fill="url(#a-glow)" rx="16"/>
  <!-- Decorative circles -->
  <circle cx="1030" cy="370" r="240" fill="#FF7A00" opacity="0.07"/>
  <circle cx="100" cy="40" r="160" fill="#ffffff" opacity="0.03"/>
  <circle cx="350" cy="350" r="100" fill="#ffffff" opacity="0.04"/>
  <!-- Icon group - phone + waves -->
  <g transform="translate(870, 125)">
    <rect x="5" y="0" width="46" height="85" rx="8" fill="#ffffff" opacity="0.12"/>
    <rect x="10" y="6" width="36" height="60" rx="5" fill="none" stroke="#FF7A00" stroke-width="2.5"/>
    <line x1="18" y1="72" x2="38" y2="72" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="28" cy="76" r="2" fill="#FF7A00"/>
  </g>
  <!-- WiFi arcs -->
  <g transform="translate(800, 100)" fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M15,50 Q35,20 55,50" stroke-width="3" opacity="0.3"/>
    <path d="M22,58 Q35,35 48,58" stroke-width="2.5" opacity="0.5"/>
    <circle cx="35" cy="66" r="3" fill="#FF7A00" stroke="none"/>
  </g>
  <!-- Text content -->
  <text x="65" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Buy Airtime &amp; Data</text>
  <text x="65" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#ffffff" opacity="0.75" font-weight="400">Instant top-up for MTN, Glo, Airtel &amp; 9mobile</text>
  <!-- CTA button -->
  <rect x="65" y="235" width="180" height="48" rx="24" fill="url(#a-btn)"/>
  <text x="155" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Recharge Now</text>
  <!-- Feature tags -->
  <g transform="translate(65, 320)">
    <rect x="0" y="0" width="100" height="28" rx="14" fill="#ffffff" opacity="0.1"/>
    <text x="50" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Instant</text>
    <rect x="110" y="0" width="110" height="28" rx="14" fill="#ffffff" opacity="0.1"/>
    <text x="165" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Best Rates</text>
    <rect x="230" y="0" width="120" height="28" rx="14" fill="#ffffff" opacity="0.1"/>
    <text x="290" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">24/7 Support</text>
  </g>
</svg>

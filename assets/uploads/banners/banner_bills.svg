<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1200" y2="400">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#e06500"/>
    </linearGradient>
    <linearGradient id="b-btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
    <linearGradient id="b-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Base -->
  <rect width="1200" height="400" fill="url(#b-bg)" rx="16"/>
  <rect width="1200" height="400" fill="url(#b-glow)" rx="16"/>
  <!-- Decorative elements -->
  <circle cx="1050" cy="50" r="220" fill="#ffffff" opacity="0.05"/>
  <circle cx="200" cy="380" r="180" fill="#0A2A7A" opacity="0.06"/>
  <circle cx="600" cy="200" r="300" fill="#ffffff" opacity="0.02"/>
  <!-- TV icon -->
  <g transform="translate(850, 120)">
    <rect x="0" y="5" width="65" height="45" rx="5" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
    <line x1="15" y1="50" x2="8" y2="70" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="50" y1="50" x2="57" y2="70" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="25" y1="70" x2="40" y2="70" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <rect x="8" y="12" width="49" height="25" rx="3" fill="#ffffff" opacity="0.15"/>
    <circle cx="32" cy="25" r="6" fill="#ffffff" opacity="0.35"/>
  </g>
  <!-- Lightning icon -->
  <g transform="translate(780, 95)" fill="#FFD700">
    <polygon points="30,5 8,40 22,40 12,65 42,25 27,25 38,5" opacity="0.9"/>
  </g>
  <!-- Text content -->
  <text x="65" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Pay Bills &amp; Utilities</text>
  <text x="65" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#ffffff" opacity="0.85" font-weight="400">Cable TV, Electricity &amp; Exam PINs — all in one place</text>
  <!-- CTA button - white with orange text -->
  <rect x="65" y="235" width="200" height="48" rx="24" fill="url(#b-btn)"/>
  <text x="165" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#FF7A00" text-anchor="middle">Pay with MsjPay</text>
  <!-- Feature tags -->
  <g transform="translate(65, 320)">
    <rect x="0" y="0" width="110" height="28" rx="14" fill="#ffffff" opacity="0.15"/>
    <text x="55" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">DSTV &amp; GOtv</text>
    <rect x="120" y="0" width="110" height="28" rx="14" fill="#ffffff" opacity="0.15"/>
    <text x="175" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Prepaid Elec</text>
    <rect x="240" y="0" width="110" height="28" rx="14" fill="#ffffff" opacity="0.15"/>
    <text x="295" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Exam PINs</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="1200" y2="400">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="c-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#e65c00"/>
    </linearGradient>
    <linearGradient id="c-btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="c-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Base -->
  <rect width="1200" height="400" fill="url(#c-bg)" rx="16"/>
  <rect width="1200" height="400" fill="url(#c-glow)" rx="16"/>
  <!-- Decorative circles -->
  <circle cx="1050" cy="350" r="230" fill="#FF7A00" opacity="0.04"/>
  <circle cx="80" cy="-50" r="180" fill="#4F46E5" opacity="0.05"/>
  <circle cx="500" cy="200" r="260" fill="#ffffff" opacity="0.015"/>
  <!-- Card visual -->
  <g transform="translate(830, 95)">
    <!-- Card shadow -->
    <rect x="4" y="4" width="170" height="105" rx="12" fill="#000000" opacity="0.2"/>
    <!-- Card body -->
    <rect x="0" y="0" width="170" height="105" rx="12" fill="url(#c-card)"/>
    <!-- Card chip -->
    <rect x="16" y="35" width="32" height="22" rx="4" fill="#ffffff" opacity="0.2"/>
    <rect x="16" y="35" width="32" height="22" rx="4" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
    <!-- Card network circles -->
    <circle cx="140" cy="80" r="16" fill="#ffffff" opacity="0.12"/>
    <circle cx="126" cy="80" r="16" fill="#ffffff" opacity="0.12"/>
    <!-- Card number -->
    <text x="16" y="26" font-family="monospace" font-size="7" fill="#ffffff" opacity="0.5" letter-spacing="1">VIRTUAL CARD</text>
    <text x="16" y="78" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#ffffff" letter-spacing="2">••••  ••••  ••••  8942</text>
    <text x="16" y="93" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" fill="#ffffff" opacity="0.5">VALID THRU</text>
    <text x="80" y="93" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="bold" fill="#ffffff">12/27</text>
  </g>
  <!-- Text content -->
  <text x="65" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Virtual Dollar Card</text>
  <text x="65" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#ffffff" opacity="0.75" font-weight="400">Pay for subscriptions, shopping &amp; services worldwide</text>
  <!-- CTA button -->
  <rect x="65" y="235" width="200" height="48" rx="24" fill="url(#c-btn)"/>
  <text x="165" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Create Free Card</text>
  <!-- Feature tags -->
  <g transform="translate(65, 320)">
    <rect x="0" y="0" width="95" height="28" rx="14" fill="#ffffff" opacity="0.08"/>
    <text x="47.5" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">USD Account</text>
    <rect x="105" y="0" width="95" height="28" rx="14" fill="#ffffff" opacity="0.08"/>
    <text x="152.5" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Low Fees</text>
    <rect x="210" y="0" width="110" height="28" rx="14" fill="#ffffff" opacity="0.08"/>
    <text x="265" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Instant Fund</text>
  </g>
</svg>
